<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle del Comercio - igw</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --color-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --color-accent: #10b981;
      --color-danger: #ef4444;
      --color-warning: #f59e0b;
      --color-bg: #f8fafc;
      --color-card: #ffffff;
      --color-secondary: #e2e8f0;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border-color: #e5e7eb;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --color-bg: #1e1f23;
      --color-card: #2a2b31;
      --text-dark: #f0f0f0;
      --text-light: #aaa;
      --shadow: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--color-bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--color-primary);
      color: white;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-lg);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    button.theme-toggle {
      background: transparent;
      color: white;
      font-size: 1.5rem;
      padding: 0.5rem;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    button.theme-toggle:hover {
      opacity: 0.8;
    }

    header a {
      background: white;
      color: #667eea;
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header a:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--color-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
    }

    .hero {
      position: relative;
      margin-bottom: 2rem;
    }

    .main-image {
      width: 100%;
      height: 400px;
      border-radius: var(--radius);
      object-fit: cover;
      box-shadow: var(--shadow-md);
    }

    .hero-overlay {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 1rem;
      border-radius: var(--radius);
      max-width: 300px;
    }

    .hero-overlay h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .hero-overlay p {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .nivel {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      background: #cd7f32; /* Default bronce */
    }

        .nivel[data-nivel="plata"] { background: #c0c0c0; }
    .nivel[data-nivel="oro"] { background: #ffd700; }
    .nivel[data-nivel="diamante"] { background: #b9f2ff; }

    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.9rem;
      color: white;
      margin-bottom: 1rem;
    }

    .open { background: var(--color-accent); }
    .closed { background: var(--color-danger); }

    .section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #764ba2f9;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    .section h3 {
      color: #667eea;
      text-shadow: 0px 1px 10px #1e1f23;
      margin-bottom: 1rem;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-item i {
      color: #667eea;
      text-shadow: 0px 1px 5px black;
      font-size: 1.2rem;
    }

    .dias-activos {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .dia-badge {
      background: var(--color-accent);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .horarios-lista {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .horarios-lista li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .horarios-lista li:last-child {
      border-bottom: none;
    }

    .horarios-lista .dia {
      font-weight: 600;
      color: var(--text-dark);
    }

    .horarios-lista .franjas {
      color: #1bda9b;
      font-size: 0.9rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .tag {
      background: #e8e8e8;
      color: #333;
      border-radius: 20px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .tag:hover {
      background: #667eea;
      color: white;
    }

    [data-theme="dark"] .tag {
      background: #3a3b40;
      color: #ddd;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .gallery img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-md);
    }

    .map-container {
      height: 70px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .map-link {
      display: inline-block;
      margin-top: 1rem;
      background: var(--color-accent);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .map-link:hover {
      background: #0c9e6e;
      transform: translateY(-2px);
    }

    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .social-btn {
      background: #667eea;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 1px 5px black;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .social-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
      box-shadow: 0 1px 5px white;
    }

    .whatsapp-btn {
      background: #25d366;
      color: white;
      padding: 1rem 2rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      transition: var(--transition);
    }

    .whatsapp-btn:hover {
      background: #128c7e;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      background: var(--color-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .modal-content img {
      width: 100%;
      height: auto;
      display: block;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--color-danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: #c52d3d;
    }

    .visualizaciones {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 0.5rem;
    }

    footer {
      background: var(--color-primary);
      color: white;
      text-align: center;
      padding: 1.2rem;
      margin-top: auto;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header {
        padding: 1rem;
        flex-direction: column;
        text-align: center;
      }
      header .controls {
        margin-top: 1rem;
      }
      main {
        margin: 1.5rem;
        padding: 1.5rem;
        box-shadow: 0 1px 10px #764ba2;
      }
      .hero-overlay {
        position: static;
        background: none;
        color: var(--text-dark);
        margin-top: 1rem;
      }
      .info-grid {
        grid-template-columns: 1fr;
      }
      .gallery {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      .social-buttons {
        justify-content: center;
      }
      .map-container {
        height: 70px;
      }
      .horarios-lista li {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body data-theme="light">
  <header>
    <h1><i class="fas fa-store"></i> Detalle del Comercio</h1>
    <div class="controls">
      <button class="theme-toggle" id="themeToggle">🌞</button>
      <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al catálogo</a>
    </div>
  </header>

  <main id="detalleContainer">
    <div class="loader" style="text-align: center; padding: 2rem;">Cargando información del comercio...</div>
  </main>

  <footer>
    igw - iglesia web
  </footer>

  <div id="imageModal" class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Imagen ampliada">
    </div>
  </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYS2Ga7h4dF9y_RyCcK8LJaCj-CUb1PuE",
      authDomain: "saboresdeldistrito.firebaseapp.com",
      projectId: "saboresdeldistrito",
      storageBucket: "saboresdeldistrito.firebasestorage.app",
      messagingSenderId: "814541339857",
      appId: "1:814541339857:web:2490bb261d7aaa423ed9f0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const themeToggle = document.getElementById('themeToggle');
    const detalleContainer = document.getElementById('detalleContainer');
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');

    // Toggle tema
    function toggleTheme() {
      const currentTheme = document.body.dataset.theme;
      document.body.dataset.theme = currentTheme === 'dark' ? 'light' : 'dark';
      themeToggle.textContent = document.body.dataset.theme === 'dark' ? '🌙' : '🌞';
    }
    themeToggle.addEventListener('click', toggleTheme);

    // Obtener ID de URL
    function getIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    // Verificar si está abierto
   // Verificar si está abierto
function estaAbierto(v) {
  const ahora = new Date();
  const diaActual = ahora.toLocaleString('es-ES', { weekday: 'long' }).toLowerCase();
  const horaActual = ahora.getHours() + ahora.getMinutes() / 60;

  if (!v.dias || !Array.isArray(v.dias) || !v.dias.includes(diaActual)) {
    return false;
  }

  let franjas = [];
  if (v.horarios) {
    if (diaActual === 'sábado' && v.horarios.sabado) {
      franjas = v.horarios.sabado;
    } else if (diaActual === 'domingo' && v.horarios.domingo) {
      franjas = v.horarios.domingo;
    } else if (v.horarios.semana) {
      franjas = v.horarios.semana;
    }
  }

  return franjas.some(h => {
    if (!h.apertura || !h.cierre) return false;
    const [hA, mA] = h.apertura.split(':').map(Number);
    const [hC, mC] = h.cierre.split(':').map(Number);
    const horaA = hA + mA / 60;
    const horaC = hC + mC / 60;
    if (horaA > horaC) {
      return horaActual >= horaA || horaActual <= horaC;
    } else {
      return horaActual >= horaA && horaActual <= horaC;
    }
  });
}

    // Formato de horarios (mejorado para lista)
    function formatoHorario(v) {
      if (!v.horarios) return "<li>No informado</li>";
      let html = "";
      if (v.horarios.semana) {
        const franjas = v.horarios.semana.map(f => `${f.apertura} - ${f.cierre}`).join(', ');
        html += `<li><span class="dia">Lunes a Viernes</span><span class="franjas">${franjas}</span></li>`;
      }
      if (v.horarios.sabado) {
        const franjas = v.horarios.sabado.map(f => `${f.apertura} - ${f.cierre}`).join(', ');
        html += `<li><span class="dia">Sábado</span><span class="franjas">${franjas}</span></li>`;
      }
      if (v.horarios.domingo) {
        const franjas = v.horarios.domingo.map(f => `${f.apertura} - ${f.cierre}`).join(', ');
        html += `<li><span class="dia">Domingo</span><span class="franjas">${franjas}</span></li>`;
      }
      return html || "<li>No informado</li>";
    }

    // Cargar detalle
    async function cargarDetalle() {
      const id = getIdFromUrl();
      if (!id) {
        detalleContainer.innerHTML = "<p>⚠️ ID de comercio no proporcionado.</p>";
        return;
      }

      try {
        const docRef = doc(db, "comercios", id);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          detalleContainer.innerHTML = "<p>⚠️ Comercio no encontrado.</p>";
          return;
        }

        const v = { id: docSnap.id, ...docSnap.data() };

        // Incrementar visualizaciones
        await updateDoc(docRef, {
          visualizaciones: (v.visualizaciones || 0) + 1
        });

        renderDetalle(v);
      } catch (error) {
        console.error('Error cargando detalle:', error);
        detalleContainer.innerHTML = "<p>❌ Error al cargar el comercio.</p>";
      }
    }

    // Render detalle
    function renderDetalle(v) {
      const abierto = estaAbierto(v);
      const estado = abierto ? "Abierto ahora" : "Cerrado";
      const nivel = v.nivel || 'bronce';
      const categoria = v.categoria || v.tipo || 'Sin categoría';
      const tagsHTML = (v.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      const galeriaHTML = (v.galeria || []).map(img => `<img src="${img}" alt="Foto del local" onclick="openModal('${img}')">`).join('');
      const diasHTML = (v.dias || []).map(d => `<span class="dia-badge">${d}</span>`).join('');

      const redes = v.redes || {};
      const socialButtons = [];
      if (redes.instagram) socialButtons.push(`<a href="${redes.instagram}" target="_blank" class="social-btn"><i class="fab fa-instagram"></i> Instagram</a>`);
      if (redes.facebook) socialButtons.push(`<a href="${redes.facebook}" target="_blank" class="social-btn"><i class="fab fa-facebook"></i> Facebook</a>`);
      if (redes.tiktok) socialButtons.push(`<a href="${redes.tiktok}" target="_blank" class="social-btn"><i class="fab fa-tiktok"></i> TikTok</a>`);
      if (redes.web) socialButtons.push(`<a href="${redes.web}" target="_blank" class="social-btn"><i class="fas fa-globe"></i> Sitio Web</a>`);
      if (redes.email) socialButtons.push(`<a href="mailto:${redes.email}" class="social-btn"><i class="fas fa-envelope"></i> Email</a>`);

      const whatsappBtn = v.whatsapp ? `<a href="https://wa.me/${v.whatsapp.replace(/\D/g, '')}?text=Hola, vi tu comercio en el catálogo." target="_blank" class="whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : '';

      let mapaHTML = '';
if (v.mapLink) {
  // Si hay un link personalizado, usar un botón que lo abra
  mapaHTML = `<a href="${v.mapLink}" target="_blank" class="map-link"><i class="fas fa-map-marked-alt"></i> Ver mapa personalizado</a>`;
} else if (v.ubicacion && v.ubicacion.lat && v.ubicacion.lng) {
  // Enlace directo a Google Maps con coordenadas
  mapaHTML = `<a href="https://www.google.com/maps/search/?api=1&query=${v.ubicacion.lat},${v.ubicacion.lng}" target="_blank" class="map-link"><i class="fas fa-directions"></i> Cómo llegar</a>`;
} else {
  // Enlace a Google Maps con dirección
  const direccionEncoded = encodeURIComponent(v.direccion || 'Dirección no disponible');
  mapaHTML = `<a href="https://www.google.com/maps/search/?api=1&query=${direccionEncoded}" target="_blank" class="map-link"><i class="fas fa-map-marked-alt"></i> Ver en Google Maps</a>`;
}


      detalleContainer.innerHTML = `
        <div class="hero">
          <img class="main-image" src="${v.imagen}" alt="${v.nombre}">
          <div class="hero-overlay">
            <h2>${v.nombre}</h2>
            <p>${categoria}</p>
            <span class="status ${abierto ? 'open' : 'closed'}">${estado}</span>
            <div class="visualizaciones"><i class="fas fa-eye"></i> ${v.visualizaciones || 0} visualizaciones</div>
          </div>
          <span class="nivel" data-nivel="${nivel}">${nivel.charAt(0).toUpperCase() + nivel.slice(1)}</span>
        </div>

        <div class="section">
          <h3><i class="fas fa-info-circle"></i> Descripción</h3>
          <p>${v.descripcion || 'Sin descripción'}</p>
        </div>

        <div class="section">
          <h3><i class="fas fa-map-marker-alt"></i> Ubicación</h3>
          <div class="map-container">${mapaHTML}</div>
        </div>

        <div class="section">
          <h3><i class="fas fa-clock"></i> Información General</h3>
          <div class="info-grid">
            <div class="info-item"><i class="fas fa-address-card"></i> <strong>Dirección:</strong> ${v.direccion || 'No informado'}</div>
            <div class="info-item"><i class="fas fa-city"></i> <strong>Distrito:</strong> ${v.distrito || 'No informado'}</div>
            <div class="info-item"><i class="fas fa-phone"></i> <strong>Teléfono:</strong> ${v.telefono || 'No informado'}</div>
            <div class="info-item"><i class="fas fa-credit-card"></i> <strong>Métodos de pago:</strong> ${(v.metodos_pago || []).join(', ') || 'No informado'}</div>
            <div class="info-item"><i class="fas fa-calendar-alt"></i> <strong>Días activos:</strong></div>
            <div class="dias-activos">${diasHTML}</div>
            <div class="info-item"><i class="fas fa-clock"></i> <strong>Horarios:</strong></div>
            <ul class="horarios-lista">${formatoHorario(v)}</ul>
            <div class="info-item"><i class="fas fa-truck"></i> <strong>Delivery:</strong> ${v.delivery === 'si' ? 'Sí' : 'No'}</div>
          </div>
        </div>

        <div class="section">
          <h3><i class="fas fa-tags"></i> Etiquetas</h3>
          <div class="tags">${tagsHTML}</div>
        </div>

        ${galeriaHTML ? `
        <div class="section">
          <h3><i class="fas fa-images"></i> Galería</h3>
          <div class="gallery">${galeriaHTML}</div>
        </div>
        ` : ''}

        ${socialButtons.length > 0 ? `
        <div class="section">
          <h3><i class="fas fa-share-alt"></i> Redes Sociales</h3>
          <div class="social-buttons">${socialButtons.join('')}</div>
        </div>
        ` : ''}

        ${whatsappBtn ? `
        <div class="section">
          <h3><i class="fab fa-whatsapp"></i> Contacto</h3>
          ${whatsappBtn}
        </div>
        ` : ''}
      `;
    }

    // Modal de imagen
    function openModal(src) {
      modalImage.src = src;
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    window.openModal = openModal;
    window.closeModal = closeModal;

    // Tema inicial
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.dataset.theme = 'dark';
      themeToggle.textContent = '🌙';
    }

    // Cargar detalle inicial
    cargarDetalle();

    // Auto-actualización cada 2 min
    setInterval(() => {
      cargarDetalle();
    }, 120000);
  </script>
</body>
</html>
