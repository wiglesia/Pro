<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sabores del Distrito</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #2b4c7e;
      --color-accent: #28a745;
      --color-danger: #dc3545;
      --color-bg: #f5f7fa;
      --color-card: #ffffff;
      --text-dark: #222;
      --text-light: #555;
      --shadow: rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    [data-theme="dark"] {
      --color-bg: #1e1f23;
      --color-card: #2a2b31;
      --text-dark: #f0f0f0;
      --text-light: #aaa;
      --shadow: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    body {
      background: var(--color-bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--color-primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px var(--shadow);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    select, button {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      background: white;
      color: var(--color-primary);
      font-weight: 600;
      transition: var(--transition);
    }

    button:hover, select:hover {
      opacity: 0.9;
    }

    button.theme-toggle {
      background: var(--color-accent);
      color: white;
    }

    .search-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin: 2rem auto 1rem;
      width: 90%;
      max-width: 900px;
    }

    .search-bar {
      background: var(--color-card);
      box-shadow: 0 2px 8px var(--shadow);
      border-radius: 15px;
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0.8rem 1rem;
      gap: 0.8rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--color-primary);
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--color-card);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px var(--shadow);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input { display: none; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.4s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }
    input:checked + .slider {
      background-color: var(--color-primary);
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1.8rem;
      padding: 2rem;
      width: 100%;
      max-width: 1300px;
      margin: auto;
    }

    .card {
      background: var(--color-card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 12px var(--shadow);
      transition: var(--transition);
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 18px var(--shadow);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      filter: brightness(0.95);
    }

    .card-content {
      padding: 1rem;
    }

    .card-content h3 {
      font-size: 1.2rem;
      margin-bottom: 0.2rem;
    }

    .card-content p {
      font-size: 0.95rem;
      color: var(--text-light);
      margin-bottom: 0.3rem;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      background: var(--color-accent);
    }

    .closed { background: var(--color-danger); }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .tag {
      background: #e8e8e8;
      color: #333;
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    [data-theme="dark"] .tag {
      background: #3a3b40;
      color: #ddd;
    }

    .tag:hover {
      background: var(--color-primary);
      color: white;
    }

    footer {
      background: var(--color-primary);
      color: white;
      text-align: center;
      padding: 1.2rem;
      margin-top: auto;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header { flex-direction: column; }
      .search-container { width: 95%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ Sabores del Distrito</h1>
    <div class="controls">
      <select id="districtSelect">
        <option value="todos">Todos los distritos</option>
        <option value="1">Las Flores</option>
        <option value="2">Rodeo</option>
        <option value="3">Tudcum</option>
        <option value="4">Bella Vista</option>
        <option value="5">Villa Iglesia</option>
      </select>
      <button class="theme-toggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </div>
  </header>

  <section class="search-container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o categoría...">
    </div>
    <div class="toggle-container">
      <span>Ver:</span>
      <label class="switch">
        <input type="checkbox" id="toggleActivos" checked>
        <span class="slider"></span>
      </label>
      <span id="toggleLabel">Solo activos</span>
    </div>
  </section>

  <main id="vendorsList"></main>

  <footer>
    © 2025 Sabores del Distrito — Plataforma Comunitaria
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYS2Ga7h4dF9y_RyCcK8LJaCj-CUb1PuE",
      authDomain: "saboresdeldistrito.firebaseapp.com",
      projectId: "saboresdeldistrito",
      storageBucket: "saboresdeldistrito.firebasestorage.app",
      messagingSenderId: "814541339857",
      appId: "1:814541339857:web:2490bb261d7aaa423ed9f0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contenedor = document.getElementById('vendorsList');
    const input = document.getElementById('searchInput');
    const selectDistrito = document.getElementById('districtSelect');
    const checkbox = document.getElementById('toggleActivos');
    const label = document.getElementById('toggleLabel');
    let mostrarSoloActivos = true;
    let vendedores = [];

    function estaAbierto(v) {
      const ahora = new Date();
      const diaActual = ahora.toLocaleString('es-ES', { weekday: 'long' }).toLowerCase();
      const horaActual = ahora.getHours() + ahora.getMinutes() / 60;
      if (!v.dias.includes(diaActual)) return false;
      const franjas = Array.isArray(v.horarios) ? v.horarios : [v.horario];
      return franjas.some(h => {
        const [hA, mA] = h.apertura.split(':').map(Number);
        const [hC, mC] = h.cierre.split(':').map(Number);
        const horaA = hA + mA / 60;
        const horaC = hC + mC / 60;
        return horaActual >= horaA && horaActual <= horaC;
      });
    }

    function renderVendedores() {
      contenedor.innerHTML = '';
      const busqueda = input.value.toLowerCase();
      const distrito = selectDistrito.value;

      let filtrados = vendedores.filter(v =>
        (v.nombre.toLowerCase().includes(busqueda) ||
         v.tipo.toLowerCase().includes(busqueda) ||
         v.tags.some(tag => tag.toLowerCase().includes(busqueda))) &&
        (distrito === "todos" || v.distrito == distrito)
      );

      if (mostrarSoloActivos) filtrados = filtrados.filter(estaAbierto);

      if (filtrados.length === 0) {
        contenedor.innerHTML = `<p style="grid-column:1/-1;text-align:center;">😕 No se encontraron resultados</p>`;
        return;
      }

      filtrados.forEach(v => {
        const activo = estaAbierto(v);
        const tagsHTML = v.tags.map(t => `<span class="tag">${t}</span>`).join('');
        contenedor.innerHTML += `
          <a href="detalle.html?id=${v.id}" style="text-decoration:none;color:inherit;">
            <div class="card">
              <img src="${v.imagen}" alt="${v.nombre}">
              <span class="status ${activo ? '' : 'closed'}">${activo ? 'Abierto' : 'Cerrado'}</span>
              <div class="card-content">
                <h3>${v.nombre}</h3>
                <p>${v.tipo}</p>
                <div class="tags">${tagsHTML}</div>
              </div>
            </div>
          </a>`;
      });
    }

    async function cargarComercios() {
      try {
        const snapshot = await getDocs(collection(db, "comercios"));
        vendedores = snapshot.docs.map(doc => doc.data());
        renderVendedores();
      } catch (e) {
        console.error("❌ Error al cargar comercios:", e);
        contenedor.innerHTML = `<p style="color:red;">❌ Error al cargar los comercios.</p>`;
      }
    }

    function toggleActivos() {
      mostrarSoloActivos = checkbox.checked;
      label.textContent = checkbox.checked ? "Solo activos" : "Todos los locales";
      renderVendedores();
    }

    function toggleTheme() {
      document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
    }

    input.addEventListener('input', renderVendedores);
    selectDistrito.addEventListener('change', renderVendedores);
    checkbox.addEventListener('change', toggleActivos);

    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.dataset.theme = 'dark';
    }

    cargarComercios();
    setInterval(() => {
      console.log("⏳ Actualizando estado de locales...");
      renderVendedores();
    }, 120000); // cada 2 minutos
  </script>
</body>
</html>
